V.setup=()=>{app.innerHTML=`<div class="pg"><h2>Set up your profile</h2><p class="lead">${E(S.me.phone?fph(S.me.phone):auth.currentUser.email)}</p><form data-f="setup"><div style="display:flex;justify-content:center" data-a="dp">${av(S.ng?.me||{name:'?'},84)}</div><label class="fld"><span>Your name *</span><input name="name" maxlength="40" required></label><label class="fld"><span>Username ${S.me.phone?'(optional)':'*'}</span><input name="un" maxlength="24" placeholder="e.g. boske" ${S.me.phone?'':'required'}></label><label class="fld"><span>About</span><input name="about" maxlength="80" value="Hey there! I am using NIJOK."></label><div class="err" id="er"></div><button class="btn">Continue</button></form></div>`};

const tr=(k,n)=>{const a=T[k]||[k];return String(a[LI()]||a[0]).replace('{n}',n??'')};
function warnsOf(p){const n=p.nut||{},w=[],f=v=>typeof v==='number';
 if(f(n.sugar)&&n.sugar>22.5)w.push(['r',tr('hsugar'),tr('dsugar',n.sugar)]);
 if(f(n.salt)&&n.salt>1.5)w.push(['r',tr('hsalt'),tr('dsalt',n.salt)]);
 if((f(n.fat)&&n.fat>17.5)||(f(n.sat)&&n.sat>5))w.push(['r',tr('hfat'),tr('dfat',f(n.fat)?n.fat:n.sat)]);
 if(/palm/i.test(p.ing||''))w.push(['a',tr('palm'),tr('chk')]);
 if(p.nova==4)w.push(['a',tr('ultra'),tr('dultra')]);
 if((p.additives||[]).length)w.push(['a',tr('adds',p.additives.length),p.additives.slice(0,4).join(', ')]);
 (p.allergens||[]).slice(0,4).forEach(a=>w.push(['p',tr('alg')+': '+a,tr('chk')]));return w}
function hlOf(p){const n=p.nut||{},h=[],f=v=>typeof v==='number';if(f(n.sugar)&&n.sugar<=5)h.push('ls');if(f(n.salt)&&n.salt<=.3)h.push('lsalt');if(f(n.fat)&&n.fat<=3)h.push('lf');if(f(n.protein)&&n.protein>=10)h.push('hp');if(f(n.fibre)&&n.fibre>=6)h.push('hf');if(p.nova&&!(p.additives||[]).length)h.push('noadd');return h}

async function getProd(code){if(S.pc[code])return S.pc[code];let p=null;try{p=snap(await F.getDoc(F.doc(db,'products',code)))}catch(e){}

function chipsOf(p){const n=p.nut||{},c=[],f=v=>typeof v==='number';
 if(f(n.sugar)){if(n.sugar>22.5)c.push(['r','High Sugar']);else if(n.sugar<=5)c.push(['g','Low Sugar'])}
 if(f(n.fat)){if(n.fat>17.5)c.push(['r','High Fat']);else if(n.fat<=3)c.push(['g','Low Fat'])}
 if(f(n.sat)&&n.sat>5)c.push(['r','High Sat. Fat']);if(f(n.salt)){if(n.salt>1.5)c.push(['r','High Salt']);else if(n.salt<=.3)c.push(['g','Low Salt'])}
 if(f(n.protein)&&n.protein>=10)c.push(['g','High Protein']);if(f(n.fibre)&&n.fibre>=6)c.push(['g','High Fibre']);
 if(p.nova==4)c.push(['a','Ultra-processed']);if((p.additives||[]).length)c.push(['a',p.additives.length+' additives']);(p.allergens||[]).slice(0,3).forEach(a=>c.push(['a','Contains '+a]));return c}
function simpleWords(p){const n=p.nut||{},t=[];if(p.nova==4)t.push('This is an ultra-processed food with ingredients and additives not usually used in a home kitchen.');else if(p.nova==3)t.push('This is a processed food made by adding salt, sugar or oil.');else if(p.nova==1||p.nova==2)t.push('This is a minimally processed food.');

 return t.join(' ')||'Not enough nutrition data for this product yet.'}

 cm2(){const c=S.cm[S.vp.id];ACT.cmenu({id:c.id});if(c.type!=='channel'&&c.type!=='saved')$('#sheet .sh>div').insertAdjacentHTML('beforeend',`<div class="si" data-a="ttlm"><span>⏳</span><b style="font-weight:400">Disappearing messages${c.ttl?' ('+TTLN[c.ttl]+')':''}</b></div>`)},
 ctog(d){const k={pin:'nk_pin',mute:'nk_mute',arch:'nk_arch'}[d.k],a=lsg(k,[]);lss(k,a.includes(d.id)?a.filter(x=>x!==d.id):[...a,d.id]);sheet();S.refresh&&S.refresh();toast('Done ✓')},
 ttlm(){sh2([['⏳','Off','ttlset','data-s="0"'],...Object.entries(TTLN).map(([s,n])=>['⏳',n,'ttlset',`data-s="${s}"`])])},
 async ttlset(d){sheet();const s=+d.s,c=S.cm[S.vp.id];await updChat(c.id,{ttl:s});sysMsg(c,s?`${S.me.name} set messages to disappear after ${TTLN[s]}`:`${S.me.name} turned off disappearing messages`).catch(()=>{})},
 mcopy(d){navigator.clipboard?.writeText(S.msgs.find(x=>x.id===d.id).p.x);sheet();toast('Copied')},
 mnote(d){const m=S.msgs.find(x=>x.id===d.id);sheet();saveNote('Message from '+(S.U[m.from]?.name||'chat'),m.p.x)},

 manual(){sheet(`<h3>Find a product</h3><form data-f="manual"><label class="fld"><input name="q" placeholder="Barcode number or product name" required></label><button class="btn">Search</button></form><div id="res"></div>`)},
 gallery(){pickImg(async f=>{if(!('BarcodeDetector'in window))return toast('Not supported in this browser','Type the barcode instead');try{const r=await new BarcodeDetector().detect(await createImageBitmap(f));r[0]?nav('product',{code:r[0].rawValue}):toast('No barcode found in this photo')}catch(x){toast('Could not read the photo')}})},
 async torch(){try{const t=S.stream.getVideoTracks()[0];S.torch=!S.torch;await t.applyConstraints({advanced:[{torch:S.torch}]})}catch(e){toast('Flash not available')}},
 openprod(d){sheet();nav('product',{code:d.code})},
 ptab(d){S.ptab=d.t;drawProd(S.cur)},
 async install(){if(deferred){deferred.prompt();deferred=null}else sheet('<h3>📲 Install NIJOK</h3><p style="line-height:1.7"><b>Android (Chrome):</b> upar right ⋮ menu, phir <b>Install app</b> ya <b>Add to Home screen</b>.<br><b>iPhone (Safari):</b> Share button, phir <b>Add to Home Screen</b>.<br>Install ke baad NIJOK normal app ki tarah home screen se khulega.</p>')},
 lang(){sh2(LANGS.map(l=>['🌐',l[1],'langset',`data-l="${l[0]}"`]))},
 langset(d){localStorage.setItem('nk_lang',d.l);sheet();draw()},
 psave(){const p=S.cur,n=p.nut||{};saveNote(p.name,[p.brand,p.qty].filter(Boolean).join(' · ')+'\n'+chipsOf(p).map(c=>c[1]).join(', ')+'\n'+simpleWords(p)+(n.kcal?'\nEnergy: '+n.kcal+' kcal/100g':'')+'\nBarcode: '+p.code,'Food')},
 pshare(){sheet(`<h3>Share to chat</h3>${S.chats.map(c=>`<div class="si" data-a="pto" data-id="${c.id}">${info(c).av}<b style="font-weight:400">${E(info(c).name)}</b></div>`).join('')||'<p style="color:var(--mut)">No chats yet.</p>'}`)},
 async pto(d){const p=S.cur;sheet();try{await sendMsg(S.cm[d.id],{t:'text',x:`📦 ${p.name}${p.brand?' ('+p.brand+')':''}\n${chipsOf(p).map(c=>c[1]).join(', ')}\n${simpleWords(p)}`});toast('Shared ✓')}catch(e){toast('Could not share',e.message)}},
 addprod(d){sheet(`<h3>Add product</h3><form data-f="addprod"><input type="hidden" name="code" value="${E(d.code)}"><label class="fld"><span>Product name *</span><input name="name" required></label><label class="fld"><span>Brand</span><input name="brand"></label><label class="fld"><span>Ingredients</span><textarea name="ing" rows="3"></textarea></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input name="kcal" placeholder="kcal /100g" inputmode="decimal"><input name="fat" placeholder="Fat g" inputmode="decimal"><input name="sugar" placeholder="Sugar g" inputmode="decimal"><input name="salt" placeholder="Salt g" inputmode="decimal"></div><button class="btn">Save to NIJOK database</button></form>`)},
 newnote(){nav('note',{id:''})},note(d){nav('note',{id:d.id})},
 async delnote(d){await F.deleteDoc(F.doc(db,'users',S.me.uid,'notes',d.id));history.back()},
 about(){sheet(`<h3>NIJOK <i style="font-family:Pacifico;font-weight:400;color:var(--g2)">Lite</i></h3><p>Talk. Scan. Know. Save. Share.<br>Chats are end-to-end encrypted. Product data: NIJOK Database and Open Food Facts.</p><p class="by">by <b>Boske Shivadas</b></p>`)},
 async logout(){sheet();await Au.signOut(auth)},
 async leave(){const c=S.cm[S.vp.id];sheet();if(!confirm('Leave this group?'))return;if(c.admins?.includes(S.me.uid)&&c.admins.length===1){const r=c.members.find(m=>m!==S.me.uid);if(r)await updChat(c.id,{admins:F.arrayUnion(r)})}try{if(c.type!=='channel')await sysMsg(c,`${S.me.name} left`)}catch(e){}await updChat(c.id,{members:F.arrayRemove(S.me.uid),admins:F.arrayRemove(S.me.uid)});root('groups')}};
(()=>{let tm;const cancel=()=>clearTimeout(tm);document.addEventListener('touchstart',e=>{const r=e.target.closest('.row[data-id]');if(!r)return;tm=setTimeout(()=>{S.lp=Date.now();navigator.vibrate?.(30);ACT.cmenu(r.dataset)},550)},{passive:true});['touchend','touchmove','touchcancel'].forEach(t=>document.addEventListener(t,cancel,{passive:true}));document.addEventListener('contextmenu',e=>{const r=e.target.closest('.row[data-id]');if(r){e.preventDefault();ACT.cmenu(r.dataset)}})})();
document.addEventListener('click',e=>{if(S.lp&&Date.now()-S.lp<700)return;const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];f&&f(el.dataset,el)});

/* ====== Forms ====== */
const err=(m,id='er')=>{const e=document.getElementById(id);if(e)e.textContent=m};
const FORM={
 async auth(d,f,mode){let p=null,em;if(S.em){em=(d.em||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em))return err('Enter a valid email')}else{p=normPhone(d.cc,d.num);if(!p)return err('Enter a valid mobile number');em=emailOf(p)}if(d.pw.length<6)return err('Password needs 6+ characters');S.pw=d.pw;const bs=$$('.btn',f);bs.forEach(b=>b.disabled=true);
  try{if(mode==='reg')await Au.createUserWithEmailAndPassword(auth,em,d.pw);else await Au.signInWithEmailAndPassword(auth,em,d.pw)}
  catch(e){bs.forEach(b=>b.disabled=false);const c=e.code||'';err(c.includes('api-key')?'Firebase API key is wrong. Paste the exact key from Firebase console.':c==='auth/email-already-in-use'?'This number already has an account. Tap Login.':c==='auth/operation-not-allowed'?'Enable Email/Password in Firebase, Authentication, Sign-in method.':c.includes('invalid-credential')||c.includes('user-not-found')||c.includes('wrong-password')?'Wrong number or password. New here? Tap Create new account.':c||e.message)}},
 async unlock(d,f){try{await Au.signInWithEmailAndPassword(auth,auth.currentUser.email,d.pw);S.pw=d.pw;afterLogin(auth.currentUser)}catch(e){err('Wrong password')}},
 async setup(d){const un=(d.un||'').trim().toLowerCase().replace(/^@/,'');if(un||!S.me.phone){if(!/^[a-z][a-z0-9_]{3,23}$/.test(un))return err('Username needs 4-24 letters, numbers or _');if((await F.getDocs(F.query(F.collection(db,'users'),F.where('uname','==',un)))).docs.length)return err('Username already taken')}const p={name:d.name.trim(),about:d.about.trim(),color:COLORS[Math.floor(Math.random()*8)],phone:S.me.phone,createdAt:F.serverTimestamp(),lastLogin:F.serverTimestamp()};if(un)p.uname=un;if(S.dpTmp)p.photo=S.dpTmp;S.dpTmp=null;await saveProfile(S.me.uid,p);if(S.me.phone)await F.setDoc(F.doc(db,'phones',S.me.phone),{uid:S.me.uid}).catch(()=>{});afterLogin(auth.currentUser)},
 async send(d,f){const t=d.t.trim();if(!t)return;f.elements.t.value='';f.elements.t.style.height='auto';$('#mic').style.display='';$('#sb').style.display='none';send({t:'text',x:t})},
 async newchat(d){const un=(d.un||'').trim().toLowerCase().replace(/^@/,'');if(un){const q=await F.getDocs(F.query(F.collection(db,'users'),F.where('uname','>=',un),F.where('uname','<',un+'\uf8ff'),F.limit(8)));const L=q.docs.filter(x=>x.id!==S.me.uid).map(x=>({...snap(x),uid:x.id}));if(!L.length)return err('No user with this username');L.forEach(u=>S.U[u.uid]=u);const ex=L.find(u=>u.uname===un);if(ex||L.length===1){const u=ex||L[0];if(!u.pub)return err('This person must open the new NIJOK once first');return startDM(u)}err('');$('#inv').innerHTML=L.map(u=>`<div class="row" data-a="udm" data-id="${u.uid}">${av(u,40)}<div class="m"><b>${E(u.name)}</b><small>@${E(u.uname)}</small></div></div>`).join('');return}const p=normPhone(d.cc,d.num);if(!p)return err('Enter a valid mobile number');if(p===S.me.phone)return err('That is your own number');const u=await findPhone(p);
  if(!u){err('');$('#inv').innerHTML=`<div class="card" style="margin:16px 0"><h4>${E(fph(p))} is not on NIJOK yet</h4><p>Ask them to create an account.</p></div>`;return}if(!u.pub)return err('This person must open the new NIJOK once first');await startDM(u)},
 async addng(d,f){const p=normPhone(d.cc,d.num);if(!p)return err('Enter a valid mobile number');if(p===S.me.phone)return err('You are added automatically');const u=await findPhone(p);if(!u)return err('This number is not on NIJOK yet');if(!u.pub)return err('This person must open the new NIJOK once first');if(S.ng.members.some(m=>m.uid===u.uid))return err('Already added');S.U[u.uid]=u;S.ng.members.push(u);err('');f.reset();S.drm()},
 async newgroup(d){if(!S.ng.members.length)return err('Add at least one member','er2');const all=[S.me,...S.ng.members],raw=b64(crypto.getRandomValues(new Uint8Array(32))),keys={};
  for(const u of all)keys[u.uid]=await enc(await shared(u.pub),raw);
  const r=await F.addDoc(F.collection(db,'chats'),{type:'group',name:d.name.trim(),photo:S.ng.photo||'',color:S.ng.color,members:all.map(u=>u.uid),admins:[S.me.uid],createdBy:S.me.uid,kby:S.me.uid,keys,unread:{},seen:{},createdAt:F.serverTimestamp(),updatedAt:F.serverTimestamp()});
  S.ng=null;await new Promise(r=>setTimeout(r,500));await sysMsg({id:r.id},`${S.me.name} created group "${d.name.trim()}"`).catch(()=>{});rep('chat',{id:r.id})},
 async newchan(d){const un=d.un.trim().toLowerCase().replace(/^@/,'');if(!/^[a-z][a-z0-9_]{3,23}$/.test(un))return err('Username needs 4-24 letters, numbers or _');if((await F.getDocs(F.query(F.collection(db,'chats'),F.where('uname','==',un)))).docs.length)return err('This @username is taken');const r=await F.addDoc(F.collection(db,'chats'),{type:'channel',name:d.name.trim(),uname:un,photo:S.nc?.photo||'',color:COLORS[0],members:[S.me.uid],admins:[S.me.uid],createdBy:S.me.uid,unread:{},seen:{},createdAt:F.serverTimestamp(),updatedAt:F.serverTimestamp()});S.cm[r.id]={id:r.id,type:'channel',name:d.name.trim(),uname:un,photo:S.nc?.photo||'',members:[S.me.uid],admins:[S.me.uid]};S.nc=null;rep('chat',{id:r.id})},
 async findchan(d){const un=d.un.trim().toLowerCase().replace(/^@/,''),q=await F.getDocs(F.query(F.collection(db,'chats'),F.where('uname','==',un))),c=q.docs[0]&&snap(q.docs[0]);$('#res').innerHTML=c&&c.type==='channel'?`<div class="si">${av({photo:c.photo,emoji:'📢',color:c.color},44)}<div class="m"><b>${E(c.name)}</b><br><small>@${E(c.uname)} · ${c.members.length} subscribers</small></div><button class="btn sm" data-a="joinchan" data-id="${c.id}">${c.members.includes(S.me.uid)?'Open':'Join'}</button></div>`:'<p style="margin:10px 0">No channel found.</p>'},
 async gsave(d){await updChat(S.vp.id,{name:d.name.trim()});toast('Group updated ✓')},
 async addmem(d,f){const c=S.cm[S.vp.id],p=normPhone(d.cc,d.num);if(!p)return err('Enter a valid mobile number');const u=await findPhone(p);if(!u)return err('This number is not on NIJOK yet');if(!u.pub)return err('This person must open the new NIJOK once first');if(c.members.includes(u.uid))return err('Already in this group');
  S.U[u.uid]=u;const raw=await dec(await shared(S.U[c.kby].pub),c.keys[S.me.uid]);await updChat(c.id,{members:F.arrayUnion(u.uid),['keys.'+u.uid]:await enc(await shared(u.pub),raw)});await sysMsg(c,`${S.me.name} added ${u.name}`);err('');f.reset()},
 async profile(d){const p={name:d.name.trim(),about:d.about.trim()},un=(d.un||'').trim().toLowerCase().replace(/^@/,'');if(un!==(S.me.uname||'')){if(un&&!/^[a-z][a-z0-9_]{3,23}$/.test(un))return toast('Username needs 4-24 letters, numbers or _');if(un&&(await F.getDocs(F.query(F.collection(db,'users'),F.where('uname','==',un)))).docs.some(x=>x.id!==S.me.uid))return toast('Username already taken');p.uname=un}await saveProfile(S.me.uid,p);Object.assign(S.me,p);toast('Profile saved ✓');history.back()},
 async note(d){await F.setDoc(F.doc(db,'users',S.me.uid,'notes',d.id||uid_()),{title:d.title.trim(),body:d.body,cat:d.cat||'Personal',imp:!!d.imp,tags:(d.tags||'').trim(),ts:Date.now()});history.back()},
 async newpost(d){const t=(d.text||'').trim();if(!t&&!S.pp)return err('Write something or add a photo');await F.addDoc(F.collection(db,'posts'),{by:S.me.uid,text:t,img:S.pp||'',tag:d.tag||'Food',likes:[],cc:0,at:F.serverTimestamp()});S.pp='';toast('Posted ✓');history.back()},
 async comment(d){const t=(d.t||'').trim();if(!t)return;await F.addDoc(F.collection(db,'posts',S.cp,'comments'),{by:S.me.uid,text:t,at:F.serverTimestamp()});F.updateDoc(F.doc(db,'posts',S.cp),{cc:F.increment(1)}).catch(()=>{});await cmDraw()},
 async contact(d){sheet();send({t:'contact',n:d.n.trim(),p:d.p.trim()})},
 async manual(d){const q=d.q.trim();if(/^\d{6,14}$/.test(q)){sheet();return nav('product',{code:q})}$('#res').innerHTML='<p style="color:var(--mut);margin:10px 0">Searching…</p>';
  try{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=10&fields=code,product_name,brands`),j=await r.json(),a=(j.products||[]).filter(x=>x.product_name);
   $('#res').innerHTML=a.map(x=>`<div class="si" data-a="openprod" data-code="${E(x.code)}"><span>📦</span><div><b style="font-weight:500">${E(x.product_name)}</b><br><small style="color:var(--mut)">${E(x.brands||'')}</small></div></div>`).join('')||`<p style="margin:10px 0">No result. <a target="_blank" rel="noopener" style="color:var(--g)" href="https://www.google.com/search?q=${encodeURIComponent(q)}">Search on Google</a></p>`}catch(e){$('#res').innerHTML='<p style="margin:10px 0;color:var(--red)">Could not reach the database.</p>'}},
 async addprod(d){const p={name:d.name.trim(),brand:d.brand.trim(),qty:'',img:'',ing:d.ing.trim(),nut:{kcal:num(d.kcal),fat:num(d.fat),sugar:num(d.sugar),salt:num(d.salt)},allergens:[],additives:[],by:S.me.uid};Object.keys(p.nut).forEach(k=>p.nut[k]===undefined&&delete p.nut[k]);await F.setDoc(F.doc(db,'products',d.code),p);S.pc[d.code]={...p,code:d.code,src:'NIJOK Database'};sheet();toast('Thank you! Product added ✓');rep('product',{code:d.code})}};
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const fn=FORM[f.dataset.f];fn&&Promise.resolve(fn(Object.fromEntries(new FormData(f)),f,e.submitter?.value)).catch(x=>err(x.message||'Something went wrong'))});
