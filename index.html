<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<link rel="manifest" href="manifest.json">
<title>NIJOK Lite</title>
<style>
:root{--g:#2e6b3e;--bg:#f7f3ea;--c:#fffdf7;--m:#7a857c;--l:#e6e0d0}
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
html,body{height:100%}body{background:var(--bg);color:#1d2a20;overflow:hidden}
#app{max-width:480px;margin:auto;height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:18px}.top a{font-size:22px}
.body{flex:1;overflow:auto;padding:0 12px 80px}.f{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--c);border-radius:14px;margin:8px 0}
.av{width:44px;height:44px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;object-fit:cover;flex:none;font-weight:700}
.m{color:var(--m);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;background:var(--c);border-top:1px solid var(--l);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;font-size:20px;color:var(--m)}nav a.on{color:var(--g)}nav small{display:block;font-size:11px}
.fab{position:absolute;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;box-shadow:0 4px 12px #0003}
.bar{display:flex;gap:8px;align-items:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--c)}.bar input{margin:0}.bar label,.bar a{font-size:22px}
.msgs{padding:12px}
.b{max-width:80%;width:fit-content;background:var(--c);padding:8px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.b.me{background:#d9edd3;margin-left:auto}.b img{max-width:100%;border-radius:10px;display:block}.b audio{max-width:100%}
.b small{display:block;color:var(--g);font-weight:600}.a{font-size:12px;opacity:.6;display:flex;gap:10px;justify-content:flex-end}
input,textarea{width:100%;padding:12px;border:1px solid var(--l);border-radius:12px;background:var(--c);font-size:16px;margin:6px 0}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:16px;margin:8px 0;text-align:center}
.btn.o{background:var(--c);color:var(--g);border:1px solid var(--g)}.btn.d{background:#fff;color:#c0392b;border:1px solid #c0392b}
.sm{padding:8px 14px;border:0;border-radius:10px;background:var(--g);color:#fff}
#modal{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end;justify-content:center;z-index:9}#modal.on{display:flex}
.box{background:var(--bg);width:100%;max-width:480px;max-height:85%;overflow:auto;padding:18px;border-radius:20px 20px 0 0}
.pad{padding:40px 24px}.logo{color:var(--g);font-size:40px}.seg{display:flex;gap:8px;margin:18px 0}
.seg b{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--c)}.seg b.on{background:var(--g);color:#fff}
.er{color:#c0392b;font-size:13px}.empty{color:var(--m);text-align:center;margin:30px}
.grid{columns:2;gap:10px}.card{break-inside:avoid;background:var(--c);border-radius:14px;padding:10px;margin-bottom:10px;position:relative}
.card img{width:100%;border-radius:10px}.x{position:absolute;right:8px;top:8px}
.pf{text-align:center;padding:10px}.pf .av{width:90px;height:90px;margin:auto;font-size:32px}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="rc"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyC2c1A6SkBa-jjCFGsf1OO3evAoccFMxDI",authDomain:"nijok-719fa.firebaseapp.com",projectId:"nijok-719fa"});
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const au=firebase.auth(),db=firebase.firestore(),OWNER='elixir.shivadas@gmail.com',FV=firebase.firestore.FieldValue;
let me,P,tab='home',chats=[],notes=[],unsub=[],cur=null,msgUnsub=null,M={},conf,mr,ch;
const av=(d,n)=>d?`<img class="av" src="${d}">`:`<div class="av">${E((n||'?')[0]).toUpperCase()}</div>`;
const oth=c=>Object.entries(c.info||{}).find(([k])=>k!=me.uid)?.[1]||{n:'Chat'};
const nm=c=>c.group?c.name:oth(c).n,ic=c=>c.group?c.icon:oth(c).d;
const me_i=()=>({n:P.name,u:P.username,d:P.dp});
const gu=async id=>(await db.doc('users/'+id).get()).data();
function modal(h){const m=$('#modal');m.innerHTML=`<div class="box">${h}</div>`;m.className='on';m.onclick=e=>{if(e.target==m)closeM()}}
function closeM(){$('#modal').className=''}
const small=(f,w)=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,w/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(f)});

/* ---------- LOGIN ---------- */
function loginUI(){$('#app').innerHTML=`<div class="pad"><h1 class="logo">NIJØK</h1><p class="m">Connect + Notes</p>
<div class="seg"><b id="sp" class="on" onclick="seg(0)">Phone</b><b id="se" onclick="seg(1)">Email</b></div>
<div id="ph"><input id="pn" type="tel" placeholder="+91 98765 43210"><input id="otp" placeholder="OTP" style="display:none"><button class="btn" id="pb" onclick="sendOtp()">Send OTP</button></div>
<div id="em" style="display:none"><input id="ea" type="email" placeholder="Email"><input id="ep" type="password" placeholder="Password (6+ characters)"><button class="btn" onclick="emailGo(0)">Login</button><button class="btn o" onclick="emailGo(1)">Create account</button></div><p id="er" class="er"></p></div>`}
function seg(i){$('#ph').style.display=i?'none':'';$('#em').style.display=i?'':'none';$('#sp').className=i?'':'on';$('#se').className=i?'on':''}
async function sendOtp(){try{if($('#otp').style.display=='none'){window.rv=window.rv||new firebase.auth.RecaptchaVerifier('rc',{size:'invisible'});conf=await au.signInWithPhoneNumber($('#pn').value.replace(/\s/g,''),rv);$('#otp').style.display='block';$('#pb').textContent='Verify OTP'}else await conf.confirm($('#otp').value)}catch(e){$('#er').textContent=e.code+' '+e.message;try{rv.clear()}catch(_){}window.rv=null}}
async function emailGo(r){try{const a=$('#ea').value,p=$('#ep').value;r?await au.createUserWithEmailAndPassword(a,p):await au.signInWithEmailAndPassword(a,p)}catch(e){$('#er').textContent=e.code}}
function setupUI(){$('#app').innerHTML=`<div class="pad"><h2>Create your profile</h2><input id="un" placeholder="username (a-z, 0-9, _)"><input id="nm" placeholder="Your name"><button class="btn" onclick="saveSetup()">Continue</button><p id="er" class="er"></p></div>`}
async function saveSetup(){const u=$('#un').value.trim().toLowerCase(),n=$('#nm').value.trim();if(!/^[a-z0-9_]{3,20}$/.test(u)||!n)return $('#er').textContent='Username 3-20 characters (a-z, 0-9, _) aur naam likho';
try{await db.runTransaction(async t=>{const r=db.doc('usernames/'+u);if((await t.get(r)).exists)throw Error('Ye username le liya gaya hai');t.set(r,{uid:me.uid});t.set(db.doc('users/'+me.uid),{username:u,name:n,dp:'',bio:'Learn adopt grow.'})});P=await gu(me.uid);start()}catch(e){$('#er').textContent=e.message}}
au.onAuthStateChanged(async u=>{unsub.forEach(f=>f());unsub=[];cur=null;me=u;if(!u)return loginUI();const s=await db.doc('users/'+u.uid).get();if(!s.exists)return setupUI();P=s.data();start()});

/* ---------- MAIN ---------- */
function start(){
unsub.push(db.collection('chats').where('members','array-contains',me.uid).onSnapshot(s=>{chats=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updated||0)-(a.updated||0));if(cur)cur=chats.find(c=>c.id==cur.id)||cur;else render()}));
unsub.push(db.collection('users/'+me.uid+'/notes').onSnapshot(s=>{notes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);if(!cur)render()}));render()}
const go=t=>{tab=t;cur=null;render()};
function render(){const T={home:['Chats',listHome],groups:['Groups',listGroups],notes:['My Notes',listNotes],me:['Profile',profileUI]};
$('#app').innerHTML=`<div class="top"><h2>${T[tab][0]}</h2></div><div class="body">${T[tab][1]()}</div><button class="fab" onclick="plus()">+</button><nav>${[['home','🏠','Home'],['groups','👥','Groups'],['notes','📝','Notes'],['me','👤','Profile']].map(x=>`<a class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}<small>${x[2]}</small></a>`).join('')}</nav>`;if(tab=='groups')loadDisc()}
const row=c=>`<div class="row" onclick="openChat('${c.id}')">${av(ic(c),nm(c))}<div class="f"><b>${E(nm(c))}</b><div class="m">${E(c.last||'')}</div></div></div>`;
const listHome=()=>chats.map(row).join('')||'<p class="empty">Abhi koi chat nahi. + dabake friend dhundo.</p>';
const listGroups=()=>chats.filter(c=>c.group).map(row).join('')+'<h4 style="margin:16px 4px 0">Discover</h4><div id="disc"></div>';
async function loadDisc(){const s=await db.collection('chats').where('public','==',true).get(),el=$('#disc');if(!el)return;el.innerHTML=s.docs.filter(d=>!d.data().members.includes(me.uid)).map(d=>{const g=d.data();return`<div class="row">${av(g.icon,g.name)}<div class="f"><b>${E(g.name)}</b><div class="m">${g.members.length} members</div></div><button class="sm" onclick="join('${d.id}')">Join</button></div>`}).join('')||'<p class="empty">Abhi koi public group nahi</p>'}
async function join(id){await db.doc('chats/'+id).update({members:FV.arrayUnion(me.uid),['info.'+me.uid]:me_i()});loadDisc()}
const listNotes=()=>(notes.length?'':'<p class="empty">Koi note nahi. + dabake add karo.</p>')+`<div class="grid">${notes.map(n=>`<div class="card">${n.img?`<img src="${n.img}">`:''}<b>${E(n.title)}</b><p>${E(n.text)}</p><span class="x" onclick="db.doc('users/'+me.uid+'/notes/${n.id}').delete()">🗑</span></div>`).join('')}</div>`;
function plus(){if(tab=='notes')return noteUI();modal(`<h3>Create</h3><button class="btn" onclick="findUI()">🔍 Find friend / new chat</button><button class="btn o" onclick="grpUI()">👥 New group</button><button class="btn o" onclick="noteUI()">📝 New note</button>`)}
function noteUI(){modal(`<h3>New note</h3><input id="nt" placeholder="Title"><textarea id="nx" rows="5" placeholder="Likho..."></textarea><button class="btn" onclick="addNote()">Save note</button>`)}
async function addNote(){await db.collection('users/'+me.uid+'/notes').add({title:$('#nt').value,text:$('#nx').value,ts:Date.now()});closeM()}

/* ---------- FIND / DM / GROUP ---------- */
function findUI(){modal(`<h3>Find by username</h3><input id="q" placeholder="@username" oninput="find()"><div id="res"></div>`)}
async function find(){const q=$('#q').value.trim().toLowerCase().replace('@','');if(q.length<2)return;const s=await db.collection('users').where('username','>=',q).where('username','<',q+'\uf8ff').limit(10).get();
$('#res').innerHTML=s.docs.filter(d=>d.id!=me.uid).map(d=>{const u=d.data();return`<div class="row" onclick="dm('${d.id}')">${av(u.dp,u.name)}<div class="f"><b>${E(u.name)}</b><div class="m">@${E(u.username)}</div></div><button class="sm" onclick="event.stopPropagation();saveF('${d.id}')">Save</button></div>`}).join('')||'<p class="empty">Koi nahi mila</p>'}
async function saveF(id){const u=await gu(id);await db.doc('users/'+me.uid+'/friends/'+id).set({n:u.name,u:u.username});alert('Contact save ho gaya')}
async function dm(id){const u=await gu(id),cid=[me.uid,id].sort().join('_');await db.doc('chats/'+cid).set({members:[me.uid,id],group:false,info:{[me.uid]:me_i(),[id]:{n:u.name,u:u.username,d:u.dp}},updated:Date.now()},{merge:true});closeM();openChat(cid)}
async function grpUI(){const f=await db.collection('users/'+me.uid+'/friends').get();modal(`<h3>New group</h3><input id="gn" placeholder="Group name"><p class="m">Members (saved contacts):</p>${f.docs.map(d=>`<label class="row"><input style="width:auto;margin:0" type="checkbox" value="${d.id}" data-n="${E(d.data().n)}" data-u="${E(d.data().u)}"> ${E(d.data().n)} @${E(d.data().u)}</label>`).join('')||'<p class="empty">Pehle friends Save karo, baad mein group mein add kar sakte ho</p>'}<button class="btn" onclick="mkGrp()">Create group</button>`)}
async function mkGrp(){const n=$('#gn').value.trim();if(!n)return;const ms=[...document.querySelectorAll('#modal input[type=checkbox]:checked')],info={[me.uid]:me_i()};ms.forEach(x=>info[x.value]={n:x.dataset.n,u:x.dataset.u,d:''});
const r=await db.collection('chats').add({group:true,name:n,icon:'',admin:me.uid,public:false,members:[me.uid,...ms.map(x=>x.value)],info,last:'Group created',updated:Date.now()});closeM();openChat(r.id)}

/* ---------- CHAT ---------- */
async function openChat(id){cur=chats.find(c=>c.id==id)||{id,...(await db.doc('chats/'+id).get()).data()};
$('#app').innerHTML=`<div class="top"><a onclick="back()">←</a>${av(ic(cur),nm(cur))}<b class="f" onclick="${cur.group?'info()':''}">${E(nm(cur))}</b></div><div class="body msgs" id="ms"></div><div class="bar"><label>📷<input type="file" accept="image/*" hidden onchange="sendImg(this)"></label><a id="mic" onclick="rec()">🎤</a><input id="mt" placeholder="Message" onkeydown="if(event.key=='Enter')sendT()"><button class="sm" onclick="sendT()">➤</button></div>`;
if(msgUnsub)msgUnsub();
msgUnsub=db.collection('chats/'+id+'/msgs').orderBy('ts').limitToLast(100).onSnapshot(s=>{M={};$('#ms').innerHTML=s.docs.map(d=>{const m=d.data(),mine=m.from==me.uid;M[d.id]=m;return`<div class="b ${mine?'me':''}">${!mine&&cur.group?`<small>${E((cur.info?.[m.from]||{}).n)}</small>`:''}${m.img?`<img src="${m.img}">`:''}${m.aud?`<audio controls src="${m.aud}"></audio>`:''}${E(m.text||'')}<div class="a"><span onclick="saveMsg('${d.id}')">📝</span>${mine?`<span onclick="edM('${d.id}')">✏️</span><span onclick="delM('${d.id}')">🗑</span>`:''}</div></div>`}).join('');$('#ms').scrollTop=1e9})}
function back(){if(msgUnsub)msgUnsub();cur=null;render()}
async function send(m){await db.collection('chats/'+cur.id+'/msgs').add({from:me.uid,ts:Date.now(),...m});await db.doc('chats/'+cur.id).update({last:m.text||(m.img?'📷 Photo':'🎤 Voice'),updated:Date.now()})}
function sendT(){const i=$('#mt'),t=i.value.trim();if(t){i.value='';send({text:t})}}
async function sendImg(el){send({img:await small(el.files[0],800)})}
async function rec(){if(mr&&mr.state=='recording')return mr.stop();try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);ch=[];mr.ondataavailable=e=>ch.push(e.data);
mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());$('#mic').textContent='🎤';const f=new FileReader;f.onload=()=>f.result.length<9e5?send({aud:f.result}):alert('Voice message bahut lamba hai (30 sec tak rakho)');f.readAsDataURL(new Blob(ch,{type:mr.mimeType}))};mr.start();$('#mic').textContent='⏹'}catch(e){alert('Mic permission do')}}
const delM=id=>db.doc(`chats/${cur.id}/msgs/${id}`).delete();
const edM=id=>{const t=prompt('Edit message',M[id].text||'');if(t)db.doc(`chats/${cur.id}/msgs/${id}`).update({text:t})};
const saveMsg=id=>{const m=M[id];db.collection('users/'+me.uid+'/notes').add({title:'From '+nm(cur),text:m.text||'',img:m.img||'',ts:Date.now()});alert('Notes mein save ho gaya')};

/* ---------- GROUP SETTINGS ---------- */
function info(){const a=cur.admin==me.uid;modal(`<h3>${E(cur.name)}</h3>${a?`<label class="btn o">Change group icon<input type="file" accept="image/*" hidden onchange="gIcon(this)"></label><button class="btn o" onclick="gName()">Rename group</button><input id="ad" placeholder="Add member @username"><button class="btn o" onclick="gAdd()">Add member</button>`:''}<p class="m">${cur.members.length} members</p>${Object.values(cur.info||{}).map(u=>`<div class="row">${av(u.d,u.n)}<div class="f">${E(u.n)} <span class="m">@${E(u.u)}</span></div></div>`).join('')}<button class="btn d" onclick="leave()">Leave group</button>`)}
function gName(){const n=prompt('Naya naam',cur.name);if(n)db.doc('chats/'+cur.id).update({name:n});closeM()}
async function gIcon(el){await db.doc('chats/'+cur.id).update({icon:await small(el.files[0],128)});closeM()}
async function gAdd(){const u=$('#ad').value.trim().toLowerCase().replace('@',''),r=await db.doc('usernames/'+u).get();if(!r.exists)return alert('Username nahi mila');const id=r.data().uid,d=await gu(id);await db.doc('chats/'+cur.id).update({members:FV.arrayUnion(id),['info.'+id]:{n:d.name,u:d.username,d:''}});closeM()}
async function leave(){await db.doc('chats/'+cur.id).update({members:FV.arrayRemove(me.uid),['info.'+me.uid]:FV.delete()});closeM();back()}

/* ---------- PROFILE / SCAN ---------- */
const profileUI=()=>`<div class="pf"><label>${av(P.dp,P.name)}<input type="file" accept="image/*" hidden onchange="setDp(this)"></label><h3>${E(P.name)}</h3><p class="m">@${E(P.username)}</p><p class="m">${E(P.bio)}</p><p class="m">🔒 Aapka mobile number kisi ko nahi dikhta</p></div><div class="row" onclick="scanUI()">📷 Scan History</div><div class="row" onclick="editP()">✏️ Edit name / bio</div>${me.email==OWNER?'<div class="row" onclick="seed()">🥗 Create Food &amp; Health group</div>':''}<div class="row" onclick="au.signOut()">🚪 Log out</div>`;
async function setDp(el){P.dp=await small(el.files[0],128);await db.doc('users/'+me.uid).update({dp:P.dp});render()}
async function editP(){const n=prompt('Naam',P.name);if(!n)return;const b=prompt('Bio',P.bio||'')||'';P.name=n;P.bio=b;await db.doc('users/'+me.uid).update({name:n,bio:b});render()}
const sc=()=>JSON.parse(localStorage.scans||'[]');
function scanUI(){const l=sc();modal(`<h3>Scan History</h3><label class="btn">📷 Scan barcode<input type="file" accept="image/*" capture="environment" hidden onchange="doScan(this)"></label>${l.map((s,i)=>`<div class="row"><div class="f"><b>${E(s.c)}</b><div class="m">${new Date(s.t).toLocaleString()}</div></div><span onclick="delScan(${i})">🗑</span></div>`).join('')||'<p class="empty">Scan history khali hai</p>'}${l.length?'<button class="btn d" onclick="clrScan()">Clear all</button>':''}`)}
async function doScan(el){try{const b=await new BarcodeDetector().detect(await createImageBitmap(el.files[0]));if(!b.length)return alert('Barcode nahi mila');localStorage.scans=JSON.stringify([{c:b[0].rawValue,t:Date.now()},...sc()]);scanUI()}catch(e){alert('Is browser mein barcode scan support nahi hai')}}
function delScan(i){const l=sc();l.splice(i,1);localStorage.scans=JSON.stringify(l);scanUI()}
function clrScan(){localStorage.scans='[]';scanUI()}
async function seed(){const foods=['Avocado','Blueberries','Turmeric (Haldi)','Oats','Broccoli','Chia Seeds','Almonds','Banana','Curd (Dahi)','Lemon','Carrot','Mung Dal'];
const r=await db.collection('chats').add({group:true,name:'Food & Health',public:true,admin:me.uid,icon:'',members:[me.uid],info:{[me.uid]:me_i()},last:'Healthy foods list',updated:Date.now()});
await db.collection('chats/'+r.id+'/msgs').add({from:me.uid,ts:Date.now(),text:'🥗 Healthy foods:\n'+foods.map(f=>'• '+f).join('\n')});alert('Food & Health group ban gaya (Public)')}
</script></body></html>
