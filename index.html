const num=v=>v==null||v===''||isNaN(Number(v))?undefined:Number(v);
const mapOff=(o,code)=>{const n=o.nutriments||{};return{code,name:o.product_name||'Unnamed product',brand:o.brands||'',qty:o.quantity||'',img:o.image_front_url||'',ing:o.ingredients_text||'',nut:{kcal:num(n['energy-kcal_100g']),fat:num(n.fat_100g),sat:num(n['saturated-fat_100g']),carb:num(n.carbohydrates_100g),sugar:num(n.sugars_100g),fibre:num(n.fiber_100g),protein:num(n.proteins_100g),salt:num(n.salt_100g)},nova:num(o.nova_group),score:(o.nutriscore_grade||'').toUpperCase(),allergens:(o.allergens_tags||[]).map(t=>t.replace(/^\w\w:/,'')),additives:(o.additives_tags||[]).map(t=>t.replace(/^\w\w:/,'').toUpperCase()),labels:o.labels||'',cat:o.categories||'',src:'Open Food Facts'}};
async function getProd(code){if(S.pc[code])return S.pc[code];let p=null;try{p=await D.getProduct(code)}catch(e){}
 if(p){p.src='NIJOK Database'}else{try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,quantity,ingredients_text,nutriments,nova_group,nutriscore_grade,allergens_tags,additives_tags,labels,categories,image_front_url`);const j=await r.json();if(j.status===1)p=mapOff(j.product,code)}catch(e){return{error:'net',code}}}
 if(!p)return{error:'none',code};S.pc[code]=p;const rec=lsg('nijok_recent',[]).filter(x=>x.code!==code);rec.unshift({code,name:p.name,brand:p.brand,img:p.img});lss('nijok_recent',rec.slice(0,12));return p}
function chipsOf(p){const n=p.nut||{},c=[],f=v=>typeof v==='number';
 if(f(n.sugar)){if(n.sugar>22.5)c.push(['r','High Sugar']);else if(n.sugar<=5)c.push(['g','Low Sugar'])}
 if(f(n.fat)){if(n.fat>17.5)c.push(['r','High Fat']);else if(n.fat<=3)c.push(['g','Low Fat'])}
 if(f(n.sat)&&n.sat>5)c.push(['r','High Sat. Fat']);if(f(n.salt)){if(n.salt>1.5)c.push(['r','High Salt']);else if(n.salt<=.3)c.push(['g','Low Salt'])}
 if(f(n.protein)&&n.protein>=10)c.push(['g','High Protein']);if(f(n.fibre)&&n.fibre>=6)c.push(['g','High Fibre']);
 if(p.nova==4)c.push(['a','Ultra-processed']);if((p.additives||[]).length)c.push(['a',p.additives.length+' additives']);(p.allergens||[]).slice(0,3).forEach(a=>c.push(['a','Contains '+a]));return c}
function simpleWords(p){const n=p.nut||{},t=[];
 if(p.nova==4)t.push('This is an ultra-processed food. It is made with ingredients and additives that are not usually found in a home kitchen.');else if(p.nova==3)t.push('This is a processed food, made by adding salt, sugar or oil to simple foods.');else if(p.nova==1||p.nova==2)t.push('This is a minimally processed food or ingredient.');
 if(typeof n.sugar==='number')t.push(n.sugar>22.5?`It has a lot of sugar (${n.sugar} g per 100 g).`:n.sugar<=5?'It is low in sugar.':`It has a moderate amount of sugar (${n.sugar} g per 100 g).`);
 if(typeof n.salt==='number'&&n.salt>1.5)t.push(`It is high in salt (${n.salt} g per 100 g).`);if(typeof n.protein==='number'&&n.protein>=10)t.push('It gives a good amount of protein.');
 return t.join(' ')||'We do not have enough nutrition data for this product yet.'}
function tipOf(p){const c=chipsOf(p).map(x=>x[1]);if(c.includes('High Sugar'))return 'Sugar is high here. Enjoy it occasionally and check the sugar from other foods and drinks today.';if(c.includes('High Salt'))return 'Salt is high here. Pair it with fresh vegetables and drink enough water.';if(c.includes('High Fat')||c.includes('High Sat. Fat'))return 'Fat is high here. Keep the portion small and balance it with lighter meals.';if(c.includes('Ultra-processed'))return 'Choose fresh or minimally processed foods for daily meals and keep this for occasional use.';return 'Read the label, watch the portion size and balance it with fruits, vegetables and water.'}

 openprod(d){nav('product',{code:d.code})},
 shareprod(){const r=lsg('nijok_recent',[]);if(!r.length)return sheet('<h3>Share a product</h3><p style="color:var(--mut)">Scan a product first, then share it here.</p>');sheet(`<h3>Share a scanned product</h3>${r.map(p=>`<div class="si" data-a="sendprod" data-code="${E(p.code)}"><div class="ic">📦</div><div><b style="font-weight:500">${E(p.name)}</b><br><small style="color:var(--mut)">${E(p.brand||'')}</small></div></div>`).join('')}`)},
 async sendprod(d){const p=lsg('nijok_recent',[]).find(x=>x.code===d.code);sheet();await D.sendMessage(S.chatMap[S.vp.id],{from:S.me.uid,type:'product',text:p.name,product:p})},
 manual(){sheet(`<h3>Find a product</h3><form data-f="manual"><label class="fld"><input name="q" placeholder="Barcode number or product name" required></label><button class="btn">Search</button></form><div id="res"></div>${lsg('nijok_recent',[]).length?`<h3 style="margin-top:16px">Recent scans</h3>${lsg('nijok_recent',[]).slice(0,6).map(p=>`<div class="si" data-a="openprod" data-code="${E(p.code)}"><div class="ic">📦</div><b style="font-weight:400">${E(p.name)}</b></div>`).join('')}`:''}`)},
 gallery(){$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!('BarcodeDetector'in window))return toast('Not supported in this browser','Type the barcode instead');try{const r=await new BarcodeDetector().detect(await createImageBitmap(f));r[0]?nav('product',{code:r[0].rawValue}):toast('No barcode found in this photo')}catch(x){toast('Could not read the photo')}}},
 async torch(){try{const t=S.stream.getVideoTracks()[0];S.torch=!S.torch;await t.applyConstraints({advanced:[{torch:S.torch}]})}catch(e){toast('Flash not available')}},
 ptab(d){S.ptab=d.t;drawProd(S.cur_p)},
 psave(){const p=S.cur_p,n=p.nut||{};saveNote(p.name,[p.brand,p.qty].filter(Boolean).join(' · ')+'\n'+chipsOf(p).map(c=>c[1]).join(', ')+'\n'+simpleWords(p)+(n.kcal?'\nEnergy: '+n.kcal+' kcal/100g':'')+'\nBarcode: '+p.code,'Product')},
 pshare(){const p=S.cur_p;sheet(`<h3>Share to chat</h3>${S.chats.map(c=>`<div class="si" data-a="pto" data-id="${c.id}">${info(c).av}<b style="font-weight:400">${E(info(c).name)}</b></div>`).join('')||'<p style="color:var(--mut)">No chats yet.</p>'}`)},
 async pto(d){const p=S.cur_p;sheet();await D.sendMessage(S.chatMap[d.id],{from:S.me.uid,type:'product',text:p.name,product:{code:p.code,name:p.name,brand:p.brand,img:p.img}});toast('Shared ✓')},
 addprod(d){sheet(`<h3>Add product</h3><form data-f="addprod"><input type="hidden" name="code" value="${E(d.code)}"><label class="fld"><span>Product name *</span><input name="name" required></label><label class="fld"><span>Brand</span><input name="brand"></label><label class="fld"><span>Pack size</span><input name="qty" placeholder="e.g. 250 g"></label><label class="fld"><span>Ingredients</span><textarea name="ing" rows="3"></textarea></label><p class="lead" style="font-size:12px">Per 100 g (optional)</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input name="kcal" placeholder="Energy kcal" inputmode="decimal" class="fld"><input name="fat" placeholder="Fat g" inputmode="decimal"><input name="sugar" placeholder="Sugar g" inputmode="decimal"><input name="salt" placeholder="Salt g" inputmode="decimal"><input name="protein" placeholder="Protein g" inputmode="decimal"></div><button class="btn" style="margin-top:12px">Save to NIJOK database</button></form>`)},
 nf(d){S.nf=d.t;V.notes()},newnote(){nav('note',{id:''})},note(d){nav('note',{id:d.id})},
 async delnote(d){await D.deleteNote(S.me.uid,d.id);history.back()},
 profile(){nav('profile')},owner(){nav('owner')},
 about(){sheet(`<h3>NIJOK</h3><p>Fact first. You decide.<br>Chat, scan food products, save notes and share with family and friends.</p><p style="color:var(--mut);margin-top:8px">Product data: NIJOK Database and Open Food Facts. Mode: ${MODE==='demo'?'Demo':'Live'}</p>`)},
 async install(){if(deferred){deferred.prompt();deferred=null}else sheet('<h3>Install NIJOK</h3><p>Open your browser menu and choose <b>Add to Home screen</b> (or <b>Install app</b>).</p>')},
 async logout(){await D.signOut()},
 async mem(d){const c=S.chatMap[S.vp.id],u=S.U[d.id],isA=c.admins?.includes(d.id);sheet(`<h3>${E(u.name)}</h3><div class="si" data-a="${isA?'unadmin':'mkadmin'}" data-id="${d.id}"><b style="font-weight:400">${isA?'Remove as admin':'Make group admin'}</b></div><div class="si" data-a="rmmem" data-id="${d.id}"><b style="font-weight:400;color:var(--red)">Remove from group</b></div>`)},
 async mkadmin(d){sheet();await D.updateChat(S.vp.id,{admins:{$union:[d.id]}})},async unadmin(d){sheet();await D.updateChat(S.vp.id,{admins:{$remove:[d.id]}})},
 async rmmem(d){sheet();const c=S.chatMap[S.vp.id];await D.updateChat(c.id,{members:{$remove:[d.id]},admins:{$remove:[d.id]}});await D.sendMessage(c,{from:S.me.uid,type:'sys',text:`${S.U[d.id].name} was removed`})},
 async leave(){const c=S.chatMap[S.vp.id];sheet();if(!confirm('Leave this group?'))return;const rest=c.members.filter(m=>m!==S.me.uid);if(c.admins?.includes(S.me.uid)&&!(c.admins||[]).some(a=>a!==S.me.uid)&&rest.length)await D.updateChat(c.id,{admins:{$union:[rest[0]]}});
  try{await D.sendMessage(c,{from:S.me.uid,type:'sys',text:`${S.me.name} left`})}catch(e){}await D.updateChat(c.id,{members:{$remove:[S.me.uid]},admins:{$remove:[S.me.uid]}});root('groups')},
 async delgroup(){const c=S.chatMap[S.vp.id];if(!confirm('Delete this group for everyone?'))return;await D.deleteChat(c.id);root('groups')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f){if(el.tagName==='A'&&!el.href)e.preventDefault();f(el.dataset,el)}});
/* ============ FORMS ============ */
const err=(m,id='er')=>{const e=document.getElementById(id);if(e)e.textContent=m};
const FORM={
 async phone(d,f){const p=normPhone(d.cc,d.num);if(!p)return err('Enter a valid mobile number');const b=$('.btn',f);b.disabled=true;b.textContent='Sending…';try{await D.sendOtp(p);nav('otp',{phone:p})}catch(e){err(MODE==='firebase'?'Could not send OTP: '+(e.code||e.message):e.message);b.disabled=false;b.textContent='Send OTP'}},
 async otp(d,f){const b=$('.btn',f);b.disabled=true;try{await D.verifyOtp(d.code.trim())}catch(e){err(e.code==='auth/invalid-verification-code'?'Wrong code. Try again.':e.message);b.disabled=false}},
 async setup(d){const p={name:d.name.trim(),email:d.email.trim(),about:d.about.trim()||'Hey there! I am using NIJOK.',color:d.color,phone:S.me.phone,createdAt:{$now:1},lastLogin:{$now:1}};await D.saveProfile(S.me.uid,p);await D.claimPhone(S.me.phone,S.me.uid).catch(()=>{});afterLogin({uid:S.me.uid,phone:S.me.phone})},
 async send(d,f){const t=d.t.trim();if(!t)return;f.elements.t.value='';f.elements.t.style.height='auto';await D.sendMessage(S.chatMap[S.vp.id],{from:S.me.uid,type:'text',text:t})},
 async newchat(d){const p=normPhone(d.cc,d.num);if(!p)return err('Enter a valid mobile number');if(p===S.me.phone)return err('That is your own number');const u=await D.findByPhone(p);if(!u){err('');return $('#inv').innerHTML=`<div class="card" style="margin:16px 0"><h4>${E(fph(p))} is not on NIJOK yet</h4><p>Invite them to join.</p><button type="button" class="btn sm" style="margin-top:8px" onclick="">Invite</button></div>`,$('#inv .btn').onclick=invite}await startDM({...u,uid:u.uid})},
 async addng(d){const p=normPhone(d.cc,d.num);if(!p)return err('Enter a valid mobile number');if(p===S.me.phone)return err('You are added automatically');const u=await D.findByPhone(p);if(!u)return err('This number is not on NIJOK yet');if(S.ng.members.some(m=>m.uid===u.uid))return err('Already added');S.U[u.uid]=u;S.ng.members.push(u);err('');$('[data-f=addng]').reset();S.drm()},
 async newgroup(d){if(!S.ng.members.length)return err('Add at least one member','er2');const m=[S.me.uid,...S.ng.members.map(u=>u.uid)];const id=await D.createChat({type:'group',name:d.name.trim(),desc:'',emoji:d.emoji,color:d.color,members:m,admins:[S.me.uid],createdBy:S.me.uid,unread:{},seen:{}});S.ng=null;S.chatMap[id]??={id,type:'group',name:d.name.trim(),emoji:d.emoji,color:d.color,members:m,admins:[S.me.uid]};await D.sendMessage(S.chatMap[id],{from:S.me.uid,type:'sys',text:`${S.me.name} created group "${d.name.trim()}"`}).catch(()=>{});rep('chat',{id})},
 async gsave(d){const up={name:d.name.trim(),desc:d.desc.trim(),emoji:d.emoji,color:d.color};Object.assign(S.chatMap[S.vp.id],up);await D.updateChat(S.vp.id,up);toast('Group updated ✓');S.refresh&&S.refresh()},
 async addmem(d){const c=S.chatMap[S.vp.id],p=normPhone(d.cc,d.num);if(!p)return err('Enter a valid mobile number');const u=await D.findByPhone(p);if(!u)return err('This number is not on NIJOK yet');if(c.members.includes(u.uid))return err('Already in this group');S.U[u.uid]=u;await D.updateChat(c.id,{members:{$union:[u.uid]}});await D.sendMessage(c,{from:S.me.uid,type:'sys',text:`${S.me.name} added ${u.name}`});err('');$('[data-f=addmem]').reset()},
 async profile(d){const p={name:d.name.trim(),about:d.about.trim(),email:d.email.trim(),emoji:d.emoji,color:d.color};await D.saveProfile(S.me.uid,p);Object.assign(S.me,p);S.U[S.me.uid]=S.me;toast('Profile saved ✓');history.back()},
 async note(d){await D.saveNote(S.me.uid,{id:d.id||uid_(),title:d.title.trim(),body:d.body,tag:d.tag,ts:Date.now()});history.back()},
 async manual(d){const q=d.q.trim();if(/^\d{6,14}$/.test(q)){sheet();return nav('product',{code:q})}$('#res').innerHTML='<p style="color:var(--mut);margin:10px 0">Searching…</p>';
  try{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=10&fields=code,product_name,brands,image_front_small_url`),j=await r.json(),a=(j.products||[]).filter(x=>x.product_name);
   $('#res').innerHTML=a.map(x=>`<div class="si" data-a="openprod" data-code="${E(x.code)}">${x.image_front_small_url?`<img src="${E(x.image_front_small_url)}" style="width:42px;height:42px;object-fit:contain" alt="">`:'<div class="ic">📦</div>'}<div><b style="font-weight:500">${E(x.product_name)}</b><br><small style="color:var(--mut)">${E(x.brands||'')}</small></div></div>`).join('')||`<p style="margin:10px 0">No result. <a target="_blank" rel="noopener" style="color:var(--g)" href="https://www.google.com/search?q=${encodeURIComponent(q)}">Search on Google</a></p>`}catch(e){$('#res').innerHTML='<p style="margin:10px 0;color:var(--red)">Could not reach the database.</p>'}},
 async addprod(d){const p={code:d.code,name:d.name.trim(),brand:d.brand.trim(),qty:d.qty.trim(),img:'',ing:d.ing.trim(),nut:{kcal:num(d.kcal),fat:num(d.fat),sugar:num(d.sugar),salt:num(d.salt),protein:num(d.protein)},allergens:[],additives:[],labels:'',cat:'',src:'NIJOK Database',by:S.me.uid};Object.keys(p.nut).forEach(k=>p.nut[k]===undefined&&delete p.nut[k]);await D.saveProduct(d.code,p);S.pc[d.code]=p;sheet();toast('Thank you! Product added ✓');rep('product',{code:d.code})}};
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const fn=FORM[f.dataset.f];fn&&Promise.resolve(fn(Object.fromEntries(new FormData(f)),f)).catch(x=>err(x.message||'Something went wrong'))});
D.onUser(u=>{if(!u){S.unsubs.forEach(f=>f());S.unsubs=[];S.me=null;root('welcome')}else afterLogin(u)});
</script></body></html>
