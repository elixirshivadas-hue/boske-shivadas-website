<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIJØK Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9b98a;--cream:#f1e3c8;--panel:#11181a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060606;color:#fff;font-family:'Poppins',sans-serif;font-weight:300;line-height:1.5}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}button{font-family:inherit}
.logo,h1,h2,h3,h4{font-family:'Cormorant Garamond',serif}
header{position:sticky;top:0;z-index:50;height:65px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4.7vw;background:#0a0a0b;border-bottom:1px solid #ffffff10}
.logo{font-size:42px;color:var(--gold);letter-spacing:1px;font-weight:600;line-height:1;display:flex;align-items:center}
.logo .pm{font:400 12px 'Poppins';letter-spacing:7px;margin-left:16px;color:var(--gold)}
nav{display:flex;gap:35px;font-size:13.5px;font-weight:400}
nav a{padding:8px 0;border-bottom:2px solid transparent}nav a.on,nav a:hover{border-color:var(--gold)}
.icons{display:flex;gap:26px;justify-content:flex-end}
.icons button,.icons a{background:none;border:0;color:#fff;cursor:pointer;display:flex}
.icons svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
.btn{display:inline-block;border:1px solid #fffa;border-radius:30px;padding:10px 26px;font-size:11.5px;font-weight:400;letter-spacing:1.5px;text-transform:uppercase;background:none;color:#fff;cursor:pointer;transition:.25s}
.btn:hover{background:var(--gold);color:#000;border-color:var(--gold)}
.btn.dk{color:#111;border-color:#111}.btn.dk:hover{background:#111;color:#fff;border-color:#111}
.btn.fill{background:#111;color:#fff;border-color:#111}.btn.fill:hover{background:var(--gold);color:#000;border-color:var(--gold)}
.hero{position:relative;height:24.4vw;min-height:370px;overflow:hidden;background:linear-gradient(90deg,#1b1913 0,#231b0d 34%,#211303 84%,#4d371f 100%)}
.himg{position:absolute;left:28.1%;top:-4.5%;width:56.6%;height:auto;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 80%,transparent)}
.hov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,7,5,.95) 0,rgba(10,7,5,.82) 28%,rgba(10,7,5,0) 52%,rgba(10,7,5,0) 84%,rgba(80,55,25,.55) 100%)}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .8s}
.slide.on{opacity:1;pointer-events:auto;z-index:2}
.txt{position:absolute;left:5.2vw;top:14%;max-width:36vw}
.tag{letter-spacing:.3em;font-size:12px;font-weight:400;margin-bottom:20px}
.txt h1{font-weight:500;font-size:4.1vw;line-height:.97;color:var(--cream)}
.txt p{margin:20px 0 22px;font-size:14.5px;line-height:1.5}
.quote{position:absolute;z-index:3;right:4.6vw;top:21%;width:11vw;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.45vw;line-height:1.3;color:var(--cream)}
.quote hr{width:42px;border:0;border-top:1px solid #fff6;margin:14px 0 12px}
.quote span{font:400 9.5px 'Poppins';letter-spacing:2px;font-style:normal;color:#fff}
.ctrl{position:absolute;z-index:4;right:4.2vw;bottom:30px;display:flex;gap:22px;align-items:center;font-size:12px;letter-spacing:1px}
.ctrl span{cursor:pointer;padding:0 4px 5px;color:#aaa;border-bottom:2px solid transparent}.ctrl span.on{color:#fff;border-color:#fff}
.ctrl button{width:30px;height:30px;border-radius:50%;border:1px solid #fff8;background:none;color:#fff;cursor:pointer}
.ctrl button.f{width:32px;height:32px;border-color:var(--gold);color:var(--gold)}
.tiles{display:grid;grid-template-columns:265fr 252fr 251fr 252fr 252fr 264fr;border-top:1px solid #ffffff20}
.tile{position:relative;aspect-ratio:265/241;overflow:hidden;background:#050505;border-right:1px solid #ffffff22}
.tile img{width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);transition:transform .6s}
.tile:hover img{transform:scale(1.06)}
.tile div{position:absolute;left:24px;right:18px;bottom:22px;display:flex;justify-content:space-between;align-items:flex-end}
.tile h3{font-weight:500;font-size:17px;text-transform:uppercase;line-height:1.1}
.tile small{font-size:9px;color:#ddd;display:block;margin-top:8px;white-space:nowrap}
.circ{width:30px;height:30px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);flex:none;transition:.25s;font-size:14px}
.tile:hover .circ{background:var(--gold);color:#000}
.spot{display:grid;grid-template-columns:374fr 461fr 343fr 358fr;padding:20px 0;background:var(--panel);border-top:1px solid #ffffff18}
.intro{padding:18px 2vw 0 4.5vw}.intro small{letter-spacing:.3em;font-size:10.5px;font-weight:400}
.intro h2{font-weight:500;font-size:2.2vw;line-height:1.05;margin:10px 0 18px}
.intro p{font-size:12.5px;margin-bottom:22px}.intro .btn{padding:8px 20px;font-size:10px}
.card{position:relative;height:15.2vw;min-height:200px;background:#0d0c0c;border:1px solid #ffffff2a;overflow:hidden;display:block}
.card img{position:absolute;left:0;top:0;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.card div{position:absolute;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:0 5%}
.card h4{font-weight:500;font-size:15px;text-transform:uppercase;line-height:1.15;margin-bottom:10px}
.card p{font-size:10px;color:#ddd;margin-bottom:22px;line-height:1.5}
.card em{font-style:normal;font-size:9.5px;letter-spacing:1px;border-top:1px solid #fff4;padding-top:8px;align-self:flex-start}
.c1 img{width:57.7%}.c1 div{width:46%}.c2 img{width:50.7%}.c2 div{width:50%}
.brandbox{display:grid;place-items:center;text-align:center;height:15.2vw;min-height:200px;background:linear-gradient(115deg,#050607 0,#0e1112 40%,#1a1d1e 52%,#050607 70%)}
.brandbox svg{width:26px;height:26px;fill:var(--gold)}
.brandbox .lg{font:600 2.9vw 'Cormorant Garamond',serif;color:var(--cream);display:block;line-height:1.1}
.brandbox small{display:block;letter-spacing:.5em;font-size:11px;margin:6px 0 16px}.brandbox p{font-size:11px;letter-spacing:1px}
footer{background:#060606;border-top:1px solid #ffffff12;min-height:79px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:12px 4.5vw;font-size:10px;color:#ddd}
.fl{display:flex;gap:18px;flex-wrap:wrap}.fl a:hover,.fr a:hover{color:var(--gold)}
.live{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:34px;color:var(--cream)}
.fr{display:flex;justify-content:flex-end;align-items:center;gap:34px}
.soc{display:flex;gap:22px}.soc svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.8}
.pagehead{padding:60px 5vw 40px;background:linear-gradient(90deg,#1b1913,#231b0d 40%,#4d371f)}
.pagehead h1{font-size:clamp(38px,5vw,64px);font-weight:500;color:var(--cream);line-height:1.05}
.pagehead p{max-width:620px;color:#d6cdbd;margin-top:12px;font-size:14px}
.crumb{font-size:11px;letter-spacing:.25em;color:var(--gold);margin-bottom:14px;font-weight:400}
.sec{padding:40px 5vw 0}.sec h2{font-size:30px;font-weight:500;color:var(--cream)}
.chips{display:flex;gap:10px;flex-wrap:wrap;padding:16px 5vw 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px;padding:24px 5vw 60px}
.item{background:var(--panel);border:1px solid #ffffff18;overflow:hidden;transition:.3s;display:block}
.item:hover{border-color:var(--gold);transform:translateY(-3px)}
.item img{height:190px;width:100%;object-fit:cover}
.item .b{padding:16px 20px 22px}.item h3{font-size:23px;font-weight:500;line-height:1.15}
.item p{font-size:12.5px;color:#b9b2a5;margin-top:8px}.item small{color:var(--gold);font-size:10px;letter-spacing:.25em;font-weight:400}
.art{display:grid;grid-template-columns:minmax(240px,380px) 1fr;gap:44px;padding:50px 5vw 40px;max-width:1150px;margin:0 auto}
.art img{width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid #ffffff22}
.art h1{font-size:clamp(34px,4.6vw,56px);font-weight:500;color:var(--cream);line-height:1.05;margin-bottom:22px}
.art p{margin-bottom:18px;font-size:15.5px;color:#e2dccf;line-height:1.8}
.nv{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.form{max-width:480px;margin:40px auto;padding:0 5vw 60px;display:grid;gap:16px}
.form input,.form select{background:#0e1a1e;border:1px solid #ffffff25;color:#fff;padding:14px;font:inherit;border-radius:4px}
.form .btn{background:var(--gold);color:#000;border:0}#msg{color:var(--gold);min-height:24px}
.txtpage{max-width:760px;margin:0 auto;padding:10px 5vw 50px}.txtpage p{color:#ddd;margin:10px 0;font-size:15px}.txtpage h2{margin-top:36px;font-size:30px;color:var(--cream);font-weight:500}
/* premium (white) */
.light main{background:#fff;color:#111}
.pmx{display:grid;grid-template-columns:34% 66%;min-height:calc(100vh - 65px)}
.pmt{display:flex;flex-direction:column;justify-content:center;padding:40px 3vw 40px 5vw}
.pmt .crumb{color:#a47d3c}
.pmt h1{font-size:clamp(44px,5.4vw,84px);font-weight:500;line-height:.98;color:#111;margin-bottom:20px}
.pmt p{color:#444;font-size:14px;margin-bottom:28px;max-width:360px}
.pmt .nv{margin:0}
.pmi{position:relative;overflow:hidden}
.pmi img{width:100%;height:100%;object-fit:cover;object-position:62% center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%);mask-image:linear-gradient(90deg,transparent,#000 14%)}
.pmi .cap{position:absolute;right:30px;bottom:26px;color:#fff;font:italic 26px 'Cormorant Garamond',serif;text-shadow:0 2px 10px #0008}
.shop{padding:70px 5vw 20px;text-align:center}.shop h2{font-size:clamp(34px,4vw,52px);font-weight:500;color:#111}.shop p{color:#666;font-size:13px}
.light .chips{justify-content:center;padding-top:20px}
.chip{border:1px solid #bbb;background:none;color:#222;border-radius:30px;padding:7px 18px;font-size:12px;cursor:pointer}
.chip.on,.chip:hover{background:#111;color:#fff;border-color:#111}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px;padding:30px 5vw 70px}
.pc{border:1px solid #eee;background:#fff;transition:.3s}.pc:hover{box-shadow:0 12px 30px #0002;transform:translateY(-4px)}
.pc img{width:100%;height:270px;object-fit:cover;background:#eee;cursor:pointer}
.pc .b{padding:16px 18px 20px}.pc small{font-size:10px;letter-spacing:.22em;color:#a47d3c;font-weight:400}
.pc h3{font-size:22px;font-weight:500;color:#111;margin:4px 0}.pc .pr{font-weight:400;color:#111;margin-bottom:14px;font-size:15px}
.pc .row{display:flex;gap:8px}.pc .btn{padding:8px 16px;font-size:10px}
.pd{display:grid;grid-template-columns:minmax(260px,480px) 1fr;gap:50px;padding:50px 5vw;max-width:1100px;margin:0 auto}
.pd img{width:100%;aspect-ratio:1/1.1;object-fit:cover}
.pd h1{font-size:clamp(34px,4.4vw,54px);font-weight:500;color:#111;line-height:1.05;margin:6px 0 12px}
.pd .pr{font-size:22px;font-weight:400;margin-bottom:18px}.pd p{color:#444;line-height:1.8;margin-bottom:14px}
.bagrow{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #eee}
.bagrow img{width:70px;height:70px;object-fit:cover}.bagrow b{font-weight:400;flex:1;color:#111}
.bagpage{max-width:760px;margin:0 auto;padding:50px 5vw 70px;color:#111}.bagpage h1{font-size:44px;font-weight:500;margin-bottom:16px}
.tot{display:flex;justify-content:space-between;font-size:18px;padding:18px 0}
.ovl{display:none;position:fixed;inset:0;z-index:100;background:#000f;padding:90px 6vw;overflow:auto}.ovl.on{display:block}
#sr input{width:100%;background:none;border:0;border-bottom:1px solid var(--gold);color:#fff;font:400 32px 'Cormorant Garamond',serif;padding:10px 0;outline:0}
.ovl ul{list-style:none;margin-top:24px}.ovl li a{display:block;padding:12px 0;border-bottom:1px solid #ffffff18;font-size:15px}
#mn li a{font:500 32px 'Cormorant Garamond',serif;color:var(--cream)}.ovl li a:hover{color:var(--gold)}
.x{position:absolute;right:6vw;top:24px;background:none;border:0;color:#fff;font-size:36px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#000;padding:12px 24px;border-radius:30px;font-size:13px;z-index:200;transition:.3s}
#toast.on{transform:translateX(-50%)}
body{background:radial-gradient(1100px 600px at 85% 0,#1d1409 0,#060606 62%) fixed,#060606}
.pb{position:relative;height:62vh;min-height:420px;overflow:hidden;background:#0a0705}.pb.sm{height:40vh;min-height:300px}
.pb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pb:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,5,3,.92) 0,rgba(8,5,3,.55) 38%,rgba(8,5,3,0) 72%),linear-gradient(0deg,#060606 0,transparent 38%)}
.pbt{position:absolute;z-index:2;left:5vw;bottom:14%;max-width:640px}
.pbt h1{font-size:clamp(40px,6vw,86px);font-weight:500;color:var(--cream);line-height:1}
.pbt p{margin-top:14px;font-size:15px;color:#e8dfcf;max-width:520px}
.inf,.nm{max-width:1150px;margin:0 auto;padding:50px 5vw 10px}
.lead{font:italic 400 clamp(24px,3vw,38px)/1.35 'Cormorant Garamond',serif;color:var(--cream);max-width:900px}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:36px}
.pt{border:1px solid #ffffff1e;background:linear-gradient(160deg,#14110c,#0a0c0d);padding:26px 24px;transition:.3s}.pt:hover{border-color:var(--gold)}
.pt b{font:500 34px 'Cormorant Garamond',serif;color:var(--gold)}.pt h3{font-size:24px;font-weight:500;margin:6px 0 8px}
.pt p{font-size:13px;color:#cfc7b8;line-height:1.7}
.nm{padding-top:40px}.nm h2{font-size:32px;font-weight:500;color:var(--cream);margin-bottom:12px}
.nm ul{list-style:none}.nm li{display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid #ffffff18}
.nm li b{font:500 22px 'Cormorant Garamond',serif}.nm li span{font-size:13px;color:#b9b2a5;max-width:520px;text-align:right}
.err{color:#ff8a7a;min-height:20px;font-size:13px}.alt{text-align:center;font-size:13px;color:#b9b2a5}.alt a{color:var(--gold)}
.form .btn{text-align:center}
@media(max-width:700px){.pbt{left:6vw;right:6vw}.nm li span{text-align:left}}
.sv{display:grid;place-items:center;width:100%;height:100%;padding:8%;background:radial-gradient(circle at 50% 45%,#2b2218,#0a0a0a 72%)}.sv.car{padding:4%}.sv svg{width:100%;height:100%}
.item .sv{height:190px}.art .sv{aspect-ratio:1;height:auto;border:1px solid #ffffff22}.pa{height:270px;overflow:hidden;cursor:pointer;background:#111}.pa img{width:100%;height:100%;object-fit:cover}.pd .pa{height:auto;aspect-ratio:1/1.1;cursor:default}.th{width:70px;height:70px;flex:none;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}.th .sv{padding:2px}
.dg,.sg{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.gc,.sc{background:linear-gradient(160deg,#14110c,#0a0c0d);border:1px solid #ffffff1e;overflow:hidden;transition:.3s}.gc:hover,.sc:hover{border-color:var(--gold);transform:translateY(-3px)}
.gv{aspect-ratio:1;display:grid;place-items:center;padding:12%;background:radial-gradient(circle at 50% 45%,#2b2218,#0a0a0a 72%)}.gv svg{width:100%;height:100%;filter:drop-shadow(0 0 22px #9fc3ea66)}
.gc .b,.sc .b{padding:18px 22px 24px}.gc small,.sc small{color:var(--gold);font-size:10px;letter-spacing:.25em;font-weight:400}
.gc h3,.sc h3{font-size:28px;font-weight:500;margin:4px 0 8px}.gc p,.sc p{font-size:13px;color:#cfc7b8;line-height:1.7;margin-bottom:10px}.gc .bt{color:#e8dfcf}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row .btn{padding:8px 18px;font-size:10px}
.sc .sv{aspect-ratio:16/10;height:auto}.sw{display:flex;align-items:center;gap:10px}.sw i{width:16px;height:16px;border-radius:50%;border:1px solid #fff6;display:block}
.sub{color:#cfc7b8;font-size:14px;max-width:820px;margin-top:20px;line-height:1.8}
.lb{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;max-width:1250px;margin:0 auto;padding:20px 5vw}.lb:empty{display:none}
.lb figure{overflow:hidden;border:1px solid #ffffff1e}.lb img{width:100%;height:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .6s}.lb figure:hover img{transform:scale(1.04)}.lb.w img{aspect-ratio:5/4}
.dcard{background:linear-gradient(160deg,#14110c,#0a0c0d);border:1px solid #ffffff1e;overflow:hidden;transition:.3s;display:block}.dcard:hover{border-color:var(--gold);transform:translateY(-3px)}
.dp{aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3a2a14,#0a0a0a 75%)}.dp img{width:100%;height:100%;object-fit:cover}.ph{padding:0!important}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.mono{font:500 clamp(56px,7vw,96px) 'Cormorant Garamond',serif;color:var(--gold);letter-spacing:4px}
.dcard .b{padding:16px 20px 22px}.dcard small{color:var(--gold);font-size:10px;letter-spacing:.25em;font-weight:400}.dcard h3{font-size:25px;font-weight:500;margin:4px 0 6px}.dcard p{font-size:12.5px;color:#b9b2a5}
.dprof{display:grid;grid-template-columns:minmax(240px,380px) 1fr;gap:44px;max-width:1150px;margin:0 auto;padding:50px 5vw 20px}.dp.big{border:1px solid #ffffff22}
.sig{list-style:none}.sig li{padding:10px 0;border-bottom:1px solid #ffffff18;color:#e2dccf;font-size:14px}.sig li:before{content:"◆";color:var(--gold);margin-right:12px;font-size:9px}
@media(max-width:1100px){.dprof{grid-template-columns:1fr}header{grid-template-columns:1fr auto}nav{display:none}.tiles{grid-template-columns:repeat(3,1fr)}.spot{grid-template-columns:1fr 1fr;row-gap:16px}.intro{grid-column:1/-1;padding:10px 5vw}.intro h2{font-size:34px}.card h4{font-size:17px}.card p,.card em{font-size:11px}.brandbox .lg{font-size:36px}.quote{display:none}.txt{max-width:60vw}.txt h1{font-size:48px}.hero{height:420px}.live{display:none}footer{grid-template-columns:1fr}.fr{justify-content:flex-start;flex-wrap:wrap}.art,.pd{grid-template-columns:1fr}.pmx{grid-template-columns:1fr}.pmi{order:-1;height:75vh}.pmi img{-webkit-mask-image:none;mask-image:none}}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}.spot{grid-template-columns:1fr}.logo .pm{display:none}.himg{left:0;width:100%;top:0;opacity:.55;-webkit-mask-image:none;mask-image:none}.txt{max-width:88vw}.txt h1{font-size:38px}.ctrl{left:5vw;right:auto}.card{height:230px}.brandbox{height:200px}}

.adm{max-width:900px;margin:0 auto;padding:30px 5vw 70px}.adm h2{font-size:30px;font-weight:500;color:var(--cream);margin-bottom:10px}
.adm form{display:grid;gap:10px;margin:16px 0}.adm input,.adm select,.adm textarea{width:100%;background:#0e1a1e;border:1px solid #ffffff25;color:#fff;padding:12px;font:inherit;border-radius:4px}
.adm .it{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #ffffff18;font-size:13px}.adm .btn{padding:7px 14px;font-size:10px}
html,body{overflow-x:hidden}
@media(max-width:700px){
.logo{font-size:32px}.icons{gap:16px}header{padding:0 4vw}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile div{left:14px;right:10px;bottom:14px}.tile h3{font-size:14px}.tile small{white-space:normal;font-size:8.5px}
.spot{grid-template-columns:minmax(0,1fr)}.card,.brandbox{min-width:0}.card h4{font-size:15px}
.txt{left:5vw;top:10%;max-width:90vw}.txt h1{font-size:34px}.tag{font-size:10px;letter-spacing:.2em;margin-bottom:12px}.txt p{font-size:13px;margin:12px 0 16px}
.ctrl{bottom:16px;gap:12px}.pc img,.pa{height:240px}.pmi{height:60vh}.pbt h1{font-size:40px}.nm li{flex-direction:column}

const STORIES=[
S('couture','fashion','The Art of Modern Couture','couture',['Couture today is a conversation between tradition and technology. Hand-finished hems sit beside laser-cut lines, and old ateliers now work with designers who grew up sketching on tablets.','What has not changed is time. A single gown can take hundreds of hours: draping on the mannequin, a first toile in plain cotton, fittings, and finally the slow work of beading and finishing by hand.','The new couture client wants more than a dress. She wants a piece with a story, made for her body and her moment, and she is willing to wait for it. That patience is the real luxury.']),
S('tailoring','fashion','Tailoring, Reimagined','fashion',['The black blazer is the most honest garment in fashion. There is nowhere for a poor cut to hide, which is why great tailors are treated like surgeons.','Today designers are loosening the lines: softer shoulders, longer jackets, fabrics with movement. The structure remains, but it now moves with the person wearing it.','A well-made jacket should feel like confidence at first wear. Look for clean lapels, a collar that rests flat, and sleeves that let you move.']),
S('jewellery','jewellery','Timeless Elegance','jewel2',['Every legendary jewel carries a story: of the stones, the hands that set them and the people who wore them. A necklace of emeralds and gold is never only an ornament; it is a record of its time.','Emeralds have been prized for centuries for their deep green, and each stone carries its own tiny garden of inclusions. Jewellers design around them instead of hiding them.','The finest pieces are passed down. That is why true craftsmanship matters: a necklace made today should still look beautiful when your grandchildren wear it.']),
S('polki','jewellery','The Hands Behind Polki','jewellery',['Behind every polki and kundan necklace is a team of artisans: the designer, the stone setter, the enameller who paints the reverse side, and the polisher who gives the piece its final glow.','Uncut diamonds are set in gold foil in a technique that goes back generations. It is slow work, and a single necklace can take weeks.','Many workshops now train a new generation to keep the craft alive. When you buy a handmade piece, you are also supporting the people who make it.']),
S('faces','models','Faces That Define a Season','models',['A great campaign begins with a face that makes people look twice. Casting directors search for something harder to name than beauty: presence, calm, and the ability to tell a story without a word.','Behind that single frame are months of work: test shoots, castings, fittings and a long day of light changes, until one image feels right.','Today the industry is widening its view of who belongs in front of the camera, and the best faces are the ones with their own point of view.']),
S('backstage','models','Backstage, Before the Lights','models',['Ten minutes before a show, backstage is a controlled storm. Hair, make-up, last-second alterations and a runway producer counting down the seconds.','The models stay quiet. Many say this is the calmest part of the day: shoes on, breath steady, and the music about to begin.','What the audience sees is twelve minutes of effortless walking. What it took is a team of hundreds who never appear on the runway.']),
S('supercar','automobiles','When Speed Becomes Art','automobiles',['A modern supercar is designed in a wind tunnel and sculpted by hand. Every curve has a job: to cut air, cool an engine or press the car to the road.','Yet the best ones also make you stop and stare in a car park. Low, wide and sharp, they are rolling sculpture.','Owners will tell you the numbers matter less than the feeling: the sound at start-up, the way the steering talks, and the first open road.']),
S('electric','automobiles','The Electric Grand Tourer','automobiles',['Luxury brands are moving to electric power, and the grand tourer is where the change is most visible: silent, fast and very comfortable over long distances.','Instant torque makes these cars faster than their looks suggest, while the cabin becomes a quiet lounge with screens, soft leather and real craftsmanship.','The question buyers now ask is no longer about range anxiety. It is about which car makes the journey itself worth taking.']),
S('coast','lifestyle','Where the Coast Meets Calm','lifestyle',['The most beautiful retreats are built into the landscape instead of on top of it: white terraces on a cliff, an infinity pool that melts into the sea, and sunsets framed by palm trees.','Luxury travel is moving away from showy to restful. Guests ask for space, privacy, local food and a day with nothing on the schedule.','Pack light, stay longer, and let the place set the pace. A few quiet days by the water can change how a whole year feels.']),
S('watch','lifestyle','A Watch Is a Promise','lifestyle',['A fine mechanical watch is a small machine of hundreds of parts, assembled and adjusted by hand. It needs no battery, only a wrist and a little care.','People buy them for many reasons: a first big milestone, a gift for a child, a keepsake that says something about its owner.','Choose a watch you will still love in thirty years, and wind it with care. Done properly, it will outlast the person who bought it.']),
S('atelier','designers','Inside the Atelier','designers',['The atelier smells of fresh cotton and steam. Mannequins stand in rows, patterns hang from the walls, and a designer fits a half-finished jacket on a model.','Here the idea becomes a garment. A sketch is cut in paper, tried in muslin, adjusted, and only then cut in the final fabric.','Designers say the best ideas come from fittings, not from the drawing board: from watching how cloth falls on a real person.']),
S('emerging','designers','The New Wave of Indian Designers','designers',['A new generation of Indian designers is mixing handloom, embroidery and modern cuts to create labels that feel both rooted and global.','Many work in small studios with local weavers and artisans, and tell the story of every piece: where the cloth came from and who made it.','They are proof that luxury does not have to be loud. It can be patient, local and made with care, and customers around the world are noticing.'])];

let gid=0;const sg=Math.sign,par=(n,f)=>Array.from({length:n},(_,i)=>f(i/n*Math.PI*2));
const poly=(vs,n)=>{const sg_=vs.map((v,i)=>[v,vs[(i+1)%vs.length]]),L=sg_.map(([a,b])=>Math.hypot(b[0]-a[0],b[1]-a[1])),T=L.reduce((a,b)=>a+b,0),o=[];for(let i=0;i<n;i++){let d=i/n*T,k=0;while(d>L[k]){d-=L[k];k++}const[a,b]=sg_[k],f=d/L[k];o.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f])}return o};
const oct=(a,b,c,d)=>[[-a,-1],[a,-1],[b,-c],[b,c],[a,1],[-a,1],[-b,c],[-b,-c]];

asscher:n=>poly(oct(.55,1,.55),n),emerald:n=>poly(oct(.5,.78,.7),n),radiant:n=>poly(oct(.62,.84,.8),n),
marquise:n=>par(n,t=>{const y=Math.cos(t);return[.5*sg(Math.sin(t))*Math.max(0,1-Math.abs(y)**1.8)**.9,y]}),

heart:n=>par(n,t=>[16*Math.sin(t)**3/17,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17])};

function gem(cut,tone='white'){const id='g'+(++gid),n=24,P=CUT[cut](n),cx=P.reduce((a,p)=>a+p[0],0)/n,cy=P.reduce((a,p)=>a+p[1],0)/n,Q=PAL[tone];
 const sc=(p,k)=>[cx+(p[0]-cx)*k,cy+(p[1]-cy)*k],M=P.map(p=>sc(p,.74)),T=P.map(p=>sc(p,.5)),pt=a=>a[0].toFixed(3)+','+a[1].toFixed(3);
 let s=`<svg viewBox="-1.15 -1.15 2.3 2.3" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="${id}" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="${Q[0]}"/><stop offset="1" stop-color="${Q[3]}"/></radialGradient></defs><polygon points="${P.map(pt).join(' ')}" fill="url(#${id})"/>`;
 for(let i=0;i<n;i++){const j=(i+1)%n;
  s+=`<polygon points="${pt(P[i])} ${pt(P[j])} ${pt(M[j])} ${pt(M[i])}" fill="${Q[(i*5)%6]}" fill-opacity=".8" stroke="#fff" stroke-opacity=".55" stroke-width=".008"/><polygon points="${pt(M[i])} ${pt(M[j])} ${pt(T[j])} ${pt(T[i])}" fill="${Q[(i*3+2)%6]}" fill-opacity=".85" stroke="#fff" stroke-opacity=".6" stroke-width=".008"/>`}
 return s+`<polygon points="${T.map(pt).join(' ')}" fill="${Q[0]}" fill-opacity=".9" stroke="#fff" stroke-width=".012"/><polygon points="${P.map(pt).join(' ')}" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width=".015"/><path d="M${cx-.1},${cy-.4}l.04,-.1 .04,.1 .1,.04 -.1,.04 -.04,.1 -.04,-.1 -.1,-.04z" fill="#fff"/></svg>`}
const shade=(h,k)=>{const n=parseInt(h.slice(1),16),f=c=>Math.max(0,Math.min(255,Math.round(k<0?c*(1+k):c+(255-c)*k)));return'#'+[n>>16,(n>>8)&255,n&255].map(f).map(x=>x.toString(16).padStart(2,'0')).join('')};
